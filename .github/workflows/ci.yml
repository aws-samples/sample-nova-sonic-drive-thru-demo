# Runs every test suite on each push to main and on pull requests.
# No AWS access is needed: the agent tests mock DynamoDB with moto, and the CDK tests only synthesize.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: Agent tests
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      # Dummy credentials so boto3 can never reach a real account; moto intercepts every call.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"  # matches agent/Dockerfile
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - run: pip install -r agent/requirements.txt -r agent/requirements-dev.txt
      - run: python -m pytest agent -q

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The protocol types are generated from agent/protocol.py (via protocol.schema.json, which
      # the agent tests check); fail if messages.ts wasn't regenerated after a change
      - run: npm run gen:protocol && git diff --exit-code -- src/protocol
      - run: npm run build  # includes the TypeScript type check
      - run: npm test

  cdk:
    name: CDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7  # CDK's Python library runs on Node.js
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cdk/requirements.txt
      # FrontendStack packages frontend/dist, so synthesizing it needs a build
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip install -r cdk/requirements.txt
      - run: python -m pytest cdk/tests -q
